name: Test Build Packages

# Every changed package is built on every supported platform. A package that
# builds on Linux-x86_64 says nothing about aarch64 or macOS, so all three legs
# run and all three must pass before a package change lands.

on:
  push:
    paths:
      - 'packages/**/*.json'
      - 'scripts/**'
      - '.github/workflows/test-build-packages.yml'
  pull_request:
    paths:
      - 'packages/**/*.json'
      - 'scripts/**'
      - '.github/workflows/test-build-packages.yml'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name to build (leave empty to build all changed packages)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  changed:
    name: Determine changed packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      count: ${{ steps.filter.outputs.count }}
    steps:
      - uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 0

      - name: List changed packages
        id: changed
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ -n '${{ github.event.inputs.package }}' ]; then
            echo '${{ github.event.inputs.package }}'
          elif [ "${{ github.event_name }}" = 'pull_request' ]; then
            bash scripts/changed-packages.sh "origin/${{ github.base_ref }}" packages/
          else
            bash scripts/changed-packages.sh HEAD^ packages/
          fi | tee /tmp/changed.txt

      - name: Drop known-slow packages
        id: filter
        run: |
          # One source of truth, shared with scripts/build-all-packages.sh.
          SLOW_PACKAGES=$(grep -vE '^\s*(#|$)' scripts/slow-packages.txt | paste -sd'|' -)
          TO_BUILD=""
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            if echo "$pkg" | grep -qEx "$SLOW_PACKAGES"; then
              echo "Skipping slow package (not test-built in CI): $pkg"
            else
              TO_BUILD="$TO_BUILD $pkg"
            fi
          done < /tmp/changed.txt
          TO_BUILD=$(echo "$TO_BUILD" | xargs || true)
          echo "packages=$TO_BUILD" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$TO_BUILD" | wc -w | tr -d ' ')" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: changed
    if: needs.changed.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: Linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: Linux-aarch64
          - runner: macos-14
            platform: macOS-aarch64
    steps:
      - uses: actions/checkout@v5.0.1

      - name: Install build essentials (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl git

      - uses: dtolnay/rust-toolchain@stable

      - name: Build TSI from source
        run: |
          git clone --depth 1 https://github.com/PanterSoft/TheSourceInstaller.git /tmp/tsi
          cargo build --release --manifest-path /tmp/tsi/Cargo.toml
          echo "/tmp/tsi/target/release" >> "$GITHUB_PATH"

      - name: Build changed packages
        env:
          TSI_PREFIX: ${{ github.workspace }}/.tsi-install
        run: |
          tsi update --local "$PWD/packages" --prefix "$TSI_PREFIX"
          FAILED=""
          for pkg in ${{ needs.changed.outputs.packages }}; do
            PKG_FILE="packages/$pkg.json"
            if [ -f "$PKG_FILE" ] && ! python3 scripts/platform_id.py --supports "$PKG_FILE"; then
              echo "Skipping $pkg: not supported on ${{ matrix.platform }}"
              continue
            fi
            echo "::group::Building $pkg on ${{ matrix.platform }}"
            tsi install --prefix "$TSI_PREFIX" "$pkg" || FAILED="$FAILED $pkg"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Failed on ${{ matrix.platform }}:$FAILED"
            exit 1
          fi
          echo "All changed packages built on ${{ matrix.platform }}."

      # Installing is not the same as working. icu installed cleanly and
      # produced libraries nothing could load, so postgres died at startup while
      # its package showed green. Inspection only -- no installed binary is run.
      - name: Installed binaries can actually load
        env:
          TSI_PREFIX: ${{ github.workspace }}/.tsi-install
        run: bash scripts/check-linkage.sh "$TSI_PREFIX" ${{ needs.changed.outputs.packages }}
