name: Package Validation

# Everything cheap and deterministic runs here, on every push and PR: schema,
# catalogue invariants, the scripts' own self-checks, shellcheck, and a
# checksum/URL check for the packages the change actually touches.
#
# The expensive things live elsewhere: test-build-packages.yml really builds
# changed packages on three platforms, validate-all-packages.yml rebuilds the
# catalogue weekly, and verify-sources.yml re-hashes every source weekly.

on:
  push:
    paths:
      - 'packages/**/*.json'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'packages/**/*.json'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate package catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 0   # changed-packages.sh diffs against a base ref

      # JSON syntax, per-version structure, `platforms` values, duplicate
      # names and unresolvable dependencies -- both file shapes.
      - name: Validate packages
        run: python3 scripts/validate-packages.py packages

      # Mainly a dedupe gate: discover-versions.py appends without checking, and
      # a repeated version number is unreachable (name@version resolves to one
      # entry) while still being read and validated. rocksdb had 28 repeats.
      # Ordering is tidiness -- the registry sorts versions itself and picks the
      # highest, so file order does not choose the default.
      - name: Versions are deduplicated and ordered
        run: |
          python3 scripts/sort-versions.py --check | tee /tmp/order.txt
          if ! grep -q '^0 package file' /tmp/order.txt; then
            echo "::error::Version lists need cleanup. Run: python3 scripts/sort-versions.py"
            exit 1
          fi

      - name: Self-check the scripts
        run: |
          python3 scripts/test_validate_packages.py
          python3 scripts/test_merge_status.py
          python3 scripts/test_sort_versions.py

      - name: Shellcheck
        run: |
          shellcheck -S warning scripts/*.sh
          for f in scripts/*.sh; do bash -n "$f"; done

      # A workflow that parses as YAML can still be broken: an unknown context,
      # a typo'd `needs`, a job reading an output that does not exist. Nothing
      # checked that here, and every package gate in this repo is a workflow.
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7

      - name: Lint workflows
        env:
          SHELLCHECK_OPTS: -S warning   # same severity as the shellcheck step
        run: ./actionlint -color

      # Only the touched packages: re-hashing the whole catalogue on every PR
      # would be minutes of downloads for no extra signal. verify-sources.yml
      # covers the rest weekly.
      - name: Sources of changed packages are pinned and reachable
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE='HEAD^'
          fi
          CHANGED=$(bash scripts/changed-packages.sh "$BASE" packages/ || true)
          if [ -z "$CHANGED" ]; then
            echo "No package definitions changed."
            exit 0
          fi
          echo "Checking: $CHANGED"
          # shellcheck disable=SC2086
          python3 scripts/add-checksums.py --check $CHANGED
