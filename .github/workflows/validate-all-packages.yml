name: Validate All Packages

# Builds the whole catalogue on every supported platform and regenerates
# PACKAGES_STATUS.md from the results. This is the source of truth for "does
# package X actually install on architecture Y" -- the per-PR workflow only
# covers changed packages.

on:
  schedule:
    - cron: '0 3 * * 0'   # Sundays 03:00 UTC
  workflow_dispatch:
    inputs:
      exclude_slow:
        description: 'Skip slow packages (gcc, llvm, python, ...)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: Linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: Linux-aarch64
          - runner: macos-14
            platform: macOS-aarch64
    steps:
      - uses: actions/checkout@v5.0.1

      - name: Install build essentials (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl git

      - uses: dtolnay/rust-toolchain@stable

      - name: Build TSI from source
        run: |
          git clone --depth 1 https://github.com/PanterSoft/TheSourceInstaller.git /tmp/tsi
          cargo build --release --manifest-path /tmp/tsi/Cargo.toml
          echo "/tmp/tsi/target/release" >> "$GITHUB_PATH"

      - name: Build every package
        id: build
        continue-on-error: true   # a failing package must still report its row
        env:
          TSI_PREFIX: ${{ github.workspace }}/.tsi-install
        run: |
          tsi update --local "$PWD/packages" --prefix "$TSI_PREFIX"
          EXCLUDE=""
          if [ "${{ inputs.exclude_slow != false }}" = "true" ]; then
            EXCLUDE="--exclude-slow"
          fi
          bash scripts/build-all-packages.sh $EXCLUDE --prefix "$TSI_PREFIX"

      # Catches the "installs green, will not load" class across the whole
      # catalogue. Reported, not fatal: the build results are the point of this
      # job, and a linkage problem should not discard them.
      - name: Installed binaries can actually load
        if: always()
        continue-on-error: true
        env:
          TSI_PREFIX: ${{ github.workspace }}/.tsi-install
        run: bash scripts/check-linkage.sh "$TSI_PREFIX" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v6.0.0
        with:
          name: results-${{ matrix.platform }}
          path: .build-logs/
          if-no-files-found: error
          # .build-logs is a dotted directory and upload-artifact skips hidden
          # files by default, so a full catalogue build across three platforms
          # ran for an hour and three quarters and then uploaded nothing.
          include-hidden-files: true

  report:
    name: Merge status table
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5.0.1

      - uses: actions/download-artifact@v7.0.0
        with:
          path: results

      # Each leg's results are committed to status-results/ next to any that
      # people contributed from platforms CI has no runner for, and the table
      # is rebuilt from that directory alone -- so anyone can regenerate it
      # locally without losing the CI columns. A leg that produced nothing
      # keeps last week's file, dated by its source line.
      - name: Regenerate PACKAGES_STATUS.md
        run: |
          mkdir -p status-results
          for f in results/results-*/results.tsv; do
            [ -f "$f" ] || continue
            platform="$(basename "$(dirname "$f")")"
            platform="${platform#results-}"
            { echo "# source: CI $(date -u +%F)"; cat "$f"; } > "status-results/$platform.tsv"
          done
          python3 scripts/merge-status.py PACKAGES_STATUS.md
          cat PACKAGES_STATUS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated status
        if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
        run: |
          git add PACKAGES_STATUS.md status-results
          if git diff --cached --quiet; then
            echo "Status table unchanged."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update PACKAGES_STATUS.md from cross-platform validation'
          git push

      - name: Fail if any package regressed
        run: |
          # ❌ means the package genuinely failed to build somewhere it claims
          # support. Blank / — / ⏭️ are "not tested", "unsupported", "blocked
          # on a dependency" and are reported, not treated as regressions here.
          # Only the package table: the legend and summary headers carry ❌ too.
          if sed -n '/^## Packages/,$p' PACKAGES_STATUS.md | grep -q '❌'; then
            echo "::warning::Some packages fail on at least one platform; see PACKAGES_STATUS.md"
          fi
