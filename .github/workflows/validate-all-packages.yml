name: Validate All Packages

# Builds the whole catalogue on every supported platform and regenerates
# PACKAGES_STATUS.md from the results. This is the source of truth for "does
# package X actually install on architecture Y" -- the per-PR workflow only
# covers changed packages.

on:
  schedule:
    - cron: '0 3 * * 0'   # Sundays 03:00 UTC
  workflow_dispatch:
    inputs:
      include_slow:
        description: 'Also build the slow packages (gcc, llvm, ...), one job each'
        required: false
        default: true
        type: boolean
      tsi_ref:
        description: 'TheSourceInstaller branch or tag to build TSI from'
        required: false
        default: main
        type: string

permissions:
  contents: read

# Four hosted platforms: everything GitHub has hardware for. Other
# architectures (armv7, riscv64, ...) have no runner, and emulating a
# whole-catalogue build under qemu would not finish inside a job's time limit.
#
# The catalogue is split so no job can run out the clock and take every other
# result with it: the fast packages build in one job per platform, and each
# slow package gets a job of its own. The weekly run once built the slow
# packages inside the catalogue job by accident, hit the 6-hour limit on both
# Linux legs, and uploaded no Linux results for weeks.
jobs:
  slow-list:
    name: List slow packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v5.0.1
      - name: Read scripts/slow-packages.txt
        id: list
        run: |
          echo "packages=$(grep -vE '^\s*(#|$)' scripts/slow-packages.txt | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate (${{ matrix.platform }}, part ${{ matrix.part }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # shard K/N builds every Nth package from K. The Intel macOS runner is
        # several times slower than the rest: the whole catalogue did not fit in
        # six hours, nor did a third of it, so it gets six parts. The others need one.
        include:
          - runner: ubuntu-latest
            platform: Linux-x86_64
            shard: 0/1
            part: 1of1
          - runner: ubuntu-24.04-arm
            platform: Linux-aarch64
            shard: 0/1
            part: 1of1
          - runner: macos-14
            platform: macOS-aarch64
            shard: 0/1
            part: 1of1
          - runner: macos-15-intel
            platform: macOS-x86_64
            shard: 0/6
            part: 1of6
          - runner: macos-15-intel
            platform: macOS-x86_64
            shard: 1/6
            part: 2of6
          - runner: macos-15-intel
            platform: macOS-x86_64
            shard: 2/6
            part: 3of6
          - runner: macos-15-intel
            platform: macOS-x86_64
            shard: 3/6
            part: 4of6
          - runner: macos-15-intel
            platform: macOS-x86_64
            shard: 4/6
            part: 5of6
          - runner: macos-15-intel
            platform: macOS-x86_64
            shard: 5/6
            part: 6of6
    steps:
      - uses: actions/checkout@v5.0.1

      - name: Install build essentials (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl git

      - uses: dtolnay/rust-toolchain@stable

      # tsi_ref lets a package change be validated against a TSI change that has
      # not reached TheSourceInstaller's main yet.
      - name: Build TSI from source
        env:
          TSI_REF: ${{ inputs.tsi_ref || 'main' }}
        run: |
          git clone --depth 1 --branch "$TSI_REF" https://github.com/PanterSoft/TheSourceInstaller.git /tmp/tsi
          cargo build --release --manifest-path /tmp/tsi/Cargo.toml
          echo "/tmp/tsi/target/release" >> "$GITHUB_PATH"

      # Slow packages are left out here and built by the `slow` job below;
      # this job still writes a row for each so none drops out of the table.
      - name: Build every package
        id: build
        continue-on-error: true   # a failing package must still report its row
        env:
          TSI_PREFIX: ${{ github.workspace }}/.tsi-install
          SHARD: ${{ matrix.shard }}
        run: |
          tsi update --local "$PWD/packages" --prefix "$TSI_PREFIX"
          bash scripts/build-all-packages.sh --exclude-slow --shard "$SHARD" --prefix "$TSI_PREFIX"

      # Catches the "installs green, will not load" class across the whole
      # catalogue. Reported, not fatal: the build results are the point of this
      # job, and a linkage problem should not discard them.
      - name: Installed binaries can actually load
        if: always()
        continue-on-error: true
        env:
          TSI_PREFIX: ${{ github.workspace }}/.tsi-install
        run: bash scripts/check-linkage.sh "$TSI_PREFIX" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: results-${{ matrix.platform }}-${{ matrix.part }}
          path: .build-logs/
          if-no-files-found: error
          # .build-logs is a dotted directory and upload-artifact skips hidden
          # files by default, so a full catalogue build across three platforms
          # ran for an hour and three quarters and then uploaded nothing.
          include-hidden-files: true

      # Last, so it sits at the end of the job log where it can be read
      # without paging through a whole catalogue's build output: the reason
      # each failed package failed.
      - name: Failure details
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/failure-details.sh .build-logs "$PLATFORM"

  slow:
    name: Slow (${{ matrix.package }}, ${{ matrix.platform }})
    needs: slow-list
    if: github.event_name == 'schedule' || inputs.include_slow
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.slow-list.outputs.packages) }}
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel]
        include:
          - runner: ubuntu-latest
            platform: Linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: Linux-aarch64
          - runner: macos-14
            platform: macOS-aarch64
          - runner: macos-15-intel
            platform: macOS-x86_64
    steps:
      - uses: actions/checkout@v5.0.1

      - name: Install build essentials (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl git

      # The big C++ builds (llvm, mongodb, ...) need more disk than a fresh
      # Linux runner leaves free.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      # tsi_ref lets a package change be validated against a TSI change that has
      # not reached TheSourceInstaller's main yet.
      - name: Build TSI from source
        env:
          TSI_REF: ${{ inputs.tsi_ref || 'main' }}
        run: |
          git clone --depth 1 --branch "$TSI_REF" https://github.com/PanterSoft/TheSourceInstaller.git /tmp/tsi
          cargo build --release --manifest-path /tmp/tsi/Cargo.toml
          echo "/tmp/tsi/target/release" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.package }}
        continue-on-error: true
        env:
          TSI_PREFIX: ${{ github.workspace }}/.tsi-install
          PKG: ${{ matrix.package }}
        run: |
          tsi update --local "$PWD/packages" --prefix "$TSI_PREFIX"
          bash scripts/build-all-packages.sh --prefix "$TSI_PREFIX" "$PKG"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: slow-${{ matrix.platform }}-${{ matrix.package }}
          path: .build-logs/
          if-no-files-found: error
          include-hidden-files: true

      # Last, so it sits at the end of the job log where it can be read
      # without paging through a whole catalogue's build output: the reason
      # each failed package failed.
      - name: Failure details
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/failure-details.sh .build-logs "$PLATFORM"

  report:
    name: Merge status table
    needs: [validate, slow]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5.0.1

      - uses: actions/download-artifact@v7.0.0
        with:
          path: results

      # Per platform: the catalogue job's rows (all its parts) first, then each slow job's row,
      # which replaces the catalogue's "not built here (slow)" placeholder. A
      # platform whose catalogue job uploaded nothing is left out rather than
      # shown as all-blank.
      - name: Regenerate PACKAGES_STATUS.md
        run: |
          ARGS=()
          for plat in Linux-x86_64 Linux-aarch64 macOS-aarch64 macOS-x86_64; do
            ls results/results-"$plat"-*/results.tsv >/dev/null 2>&1 || continue
            cat results/results-"$plat"-*/results.tsv results/slow-"$plat"-*/results.tsv 2>/dev/null > "merged-$plat.tsv" || true
            ARGS+=("$plat=merged-$plat.tsv")
          done
          python3 scripts/merge-status.py --notes scripts/status-notes.tsv PACKAGES_STATUS.md "${ARGS[@]}"
          cat PACKAGES_STATUS.md >> "$GITHUB_STEP_SUMMARY"
          # And to the log: a step summary cannot be read through the API.
          cat PACKAGES_STATUS.md

      - name: Commit updated status
        if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- PACKAGES_STATUS.md; then
            echo "Status table unchanged."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update PACKAGES_STATUS.md from cross-platform validation' -- PACKAGES_STATUS.md
          git push

      - name: Fail if any package regressed
        run: |
          # ❌ means the package genuinely failed to build somewhere it claims
          # support. Blank / — / ⏭️ are "not tested", "unsupported", "blocked
          # on a dependency" and are reported, not treated as regressions here.
          if grep -q '❌' PACKAGES_STATUS.md; then
            echo "::warning::Some packages fail on at least one platform; see PACKAGES_STATUS.md"
          fi
